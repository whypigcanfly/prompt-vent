[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-prompt-judge"
version = "0.1.0"
description = "词趣判官 · 一个无侵入的 Prompt 趣味前置评判插件，支持 Claude Code / Codex / Hermes / Workbuddy 等 Agent 安装"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["prompt", "judge", "agent", "plugin", "llm", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/whypigcanfly/prompt-vent"
Repository = "https://github.com/whypigcanfly/prompt-vent"

[project.scripts]
ci-pj = "main:main"

[tool.setuptools]
packages = [
    "core",
    "core.data",
    "core.data.config",
    "core.data.rule",
    "core.data.speech",
    "adapter",
    "service",
    "storage",
]
# 入口点 "main:main" 引用顶层模块 main.py；必须显式声明为 py_module，
# 否则非可编辑安装时 setuptools 不会把它拷进 site-packages，导致 ci-pj 脚本 import main 失败。
py_modules = ["main"]

[tool.setuptools.package-data]
# 内置资源随包发布，供 importlib.resources 读取
"core.data.config" = ["*.json"]
"core.data.rule" = ["*.json"]
"core.data.speech" = ["*.json"]
